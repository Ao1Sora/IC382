# Explicit changes to teacher/ros2/config/custom_nav2_params.yaml.
# All distances use the 10x scene; originals remain unchanged.
amcl:
  ros__parameters:
    scan_topic: scan_nav
    laser_max_range: 200.0
    laser_min_range: 1.0
    laser_likelihood_max_dist: 4.0
    sigma_hit: 0.75
    update_min_d: 0.05
    update_min_a: 0.03
    transform_tolerance: 2.0
    set_initial_pose: false
    always_reset_initial_pose: false
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    failure_tolerance: 1.0
    progress_checker:
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    general_goal_checker:
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.2
    FollowPath:
      # Keep the teacher's DWB tracker, with Nav2's collision-checked rotation
      # shim to avoid sign-flipping when leaving a desk facing away from travel.
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.5
      angular_disengage_threshold: 0.25
      forward_sampling_distance: 3.0
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      # Positive translation minimum retains the teacher's turn-speed check.
      min_speed_xy: 0.05
      min_speed_theta: 0.15
      max_vel_x: 3.5
      min_vel_x: -0.5
      max_speed_xy: 3.5
      max_vel_theta: 0.6
      acc_lim_x: 3.0
      decel_lim_x: -3.0
      acc_lim_theta: 1.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 2.0
      # DWB's metre defaults otherwise expose only 0.2 m of the 10x map.
      prune_distance: 10.0
      forward_prune_distance: 10.0
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.5
      trans_stopped_velocity: 0.05
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      width: 30
      height: 30
      resolution: 0.25
      footprint: '[[-1.3,-2.6],[-1.3,2.1],[5.05,2.1],[5.05,-2.6]]'
      footprint_padding: 0.75
      transform_tolerance: 2.0
      # The low lidar sees legs, not the table top/overhang. DWB must retain the
      # reviewed 2D table/chair occupancy instead of cutting through that space.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        scan:
          topic: /scan_nav
          inf_is_valid: true
          raytrace_min_range: 1.0
          obstacle_min_range: 1.0
      inflation_layer:
        inflation_radius: 8.0
        cost_scaling_factor: 0.3
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      resolution: 0.25
      footprint: '[[-1.3,-2.6],[-1.3,2.1],[5.05,2.1],[5.05,-2.6]]'
      footprint_padding: 0.75
      transform_tolerance: 2.0
      obstacle_layer:
        scan:
          topic: /scan_nav
          inf_is_valid: true
          raytrace_min_range: 1.0
          obstacle_min_range: 1.0
      inflation_layer:
        inflation_radius: 8.0
        cost_scaling_factor: 0.3
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
behavior_server:
  ros__parameters:
    max_rotational_vel: 0.6
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.0
    transform_tolerance: 2.0
velocity_smoother:
  ros__parameters:
    max_velocity: [3.5, 0.0, 0.6]
    min_velocity: [-0.5, 0.0, -0.6]
    max_accel: [3.0, 0.0, 1.0]
    max_decel: [-3.0, 0.0, -1.0]
    velocity_timeout: 1.0
