# All distances are real metres; all angles are radians.
# Relative paths resolve against THIS file, not the terminal working directory.
schema_version: 1
map: ""                    # Measured lidar SLAM map YAML (AMCL)
navigation_map: ""         # Same-frame map with complete tabletop keepout occupancy
params_file: ""            # Empty: use installed Wheeltec car-mode profile
points: ""                 # Optional manually measured points; empty: generate from desks
start_hardware: false      # Set true only when ready to start the physical drivers
live_obstacles: true       # false: saved maps only in both planning/control costmaps; AMCL still uses lidar
inflation_enabled: false   # No extra obstacle buffers; preserve footprint collision checks
max_linear: 0.1
max_angular: 0.3
minimum_dwell_seconds: 1.0
work_timeout_seconds: 120.0
log_directory: ~/.local/state/ic382/missions

inspection:
  parking_distance_m: 0.5  # Net gap from robot FRONT outline to tabletop edge
  points_per_desk: 3
  # null: inherit the real robot footprint from the installed teacher parameters.
  # Update this polygon after fitting upper-body mechanisms. Coordinates in base_footprint.
  robot_footprint: null
  # Measured convex tabletop polygons in map coordinates; corners in perimeter order.
  # Each edge yields one desk-facing candidate. Nav2 chooses a feasible three-point route.
  # Example structure only (no invented scene coordinates):
  # - id: T04
  #   polygon: [[x1,y1], [x2,y2], [x3,y3], [x4,y4]]
  desks: []

# Camera height/FOV/range are deliberately not guessed. Candidate poses face the
# desk, but camera coverage must be calibrated/verified before operational use.
