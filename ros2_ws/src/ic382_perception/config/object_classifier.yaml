object_classifier:
  ros__parameters:
    use_sim_time: false
    detections_topic: /ic382/perception/detections
    context_topic: /ic382/perception/context
    classified_topic: /ic382/perception/classified
    anomalies_topic: /ic382/perception/anomalies
    status_topic: /ic382/perception/status
    camera_info_topic: /camera/color/camera_info
    tag_conf_threshold: 0.5
    tagging_enabled: false         # true only with the five-class steward_v1 model
    roi: [0.0, 0.0, 1.0, 1.0]      # normalised desk ROI on the image
    max_fps: 5.0
    base_frame: base_link
    camera_frame: camera_color_optical_frame
    use_tf: true
    tf_timeout: 0.1
    allow_camera_frame_fallback: false
    log_path: ""                   # optional JSONL audit path
    save_anomaly_evidence: false
    evidence_dir: results/evidence
