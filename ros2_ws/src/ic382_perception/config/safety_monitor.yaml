safety_monitor:
  ros__parameters:
    use_sim_time: false
    detector_mode: ultralytics
    model_profile: coco_bootstrap
    model_path: ""                 # /home/student/dev/models/yolo26n.pt on the Jetson
    device: ""                     # "0" for GPU, "cpu" for offline checks
    imgsz: 640
    detection_conf: 0.35
    iou: 0.45
    half: false                    # true with a TensorRT FP16 engine on the Jetson
    max_det: 50
    warmup: true
    max_fps: 20.0                  # 15-30 FPS continuous safety loop
    image_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info
    depth_scale: 0.001             # 16UC1 millimetres -> metres; 1.0 for 32FC1
    depth_is_aligned: true         # confirm on the Astra Pro before enabling tagging
    min_depth_m: 0.1
    max_depth_m: 10.0
    stop_distance_m: 0.8
    clear_distance_m: 1.2
    confirm_frames: 3
    clear_frames: 5
    sensor_timeout: 0.5
    fail_safe_on_stale: true       # physical robot; set false only for simulation
    unknown_distance_stop: true
    person_height_m: 1.7
    detections_topic: /ic382/perception/detections
    safety_state_topic: /ic382/safety_state
    safety_stop_topic: /ic382/safety_stop
    status_topic: /ic382/perception/status
