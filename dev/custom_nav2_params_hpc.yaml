# my_nav2_params_v7.yaml (v6 without the RotationShimController)
# REQUIRES a static TF base_link -> base_footprint at the drive-axle centre (from tf2_echo:
# wheels at x = -1.189, y = +/-1.81, z = +0.25 from base_link, wheel radius 0.63):
#   ros2 run tf2_ros static_transform_publisher --x -1.189 --y 0.0 --z -0.38 \
#     --frame-id base_link --child-frame-id base_footprint
# World and robot are both 10x real scale in Isaac Sim, so all sizes here are 10x the vendor values.

amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.05 #0.2
    alpha2: 0.05 #0.2
    alpha3: 0.05 #0.2
    alpha4: 0.05 #0.2
    alpha5: 0.2
    base_frame_id: "base_footprint" # v5: was base_link. base_footprint = drive-axle centre (static TF)
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 30.0 #100.0
    laser_min_range: 0.05 #-1.0
    laser_model_type: "likelihood_field"
    max_beams: 120 #60
    max_particles: 3000 #2000
    min_particles: 1000 #500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1 #0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2  # v2: was 0.05 (vendor value) - stops AMCL yaw corrections during final in-place rotation
    update_min_d: 0.25 # v2: was 0.05 (vendor value)
    z_hit: 0.85 #0.5
    z_max: 0.05
    z_rand: 0.05 #0.5
    z_short: 0.05
    scan_topic: scan_corrected

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint # v5: was base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2 #0.5
      movement_time_allowance: 25.0 #10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.80 #0.25  (keep equal to FollowPath.xy_goal_tolerance)
      yaw_goal_tolerance: 0.25 # v2: was 0.15 (vendor value, ~14 deg)
    # v7: RotationShimController removed again (back to plain DWB, like your original file).
    # The v6 log showed the shim's slow in-place start rotation never got the robot within
    # 45 deg of the path before the progress checker gave up (4 x "Failed to make progress",
    # ~2 min). Plain DWB turns while driving forward (arcs), which this robot does well.
    # Final heading is still done by DWB's RotateToGoal (min turn speed 0.5 rad/s from v6).
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # DWB core configurations
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 2.0 # 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0 #1.0
      min_speed_xy: 0.05 # v6: was 0.0. Must be > 0, otherwise DWB ignores min_speed_theta
      max_speed_xy: 2.0
      min_speed_theta: 0.5 # v6: was 0.08. No in-place turns slower than 0.5 rad/s
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 0.8 #3.2
      decel_lim_x: -2.5 #-2.5
      decel_lim_y: 0.0
      decel_lim_theta: -0.8 #-3.2
      vx_samples: 30 #20
      vy_samples: 5
      vtheta_samples: 30 #20
      sim_time: 1.4 #1.7
      linear_granularity: 0.10 #0.05
      angular_granularity: 0.03 #0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.80 #0.25  (keep equal to general_goal_checker.xy_goal_tolerance)
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"] # v5: ObstacleFootprint checks the polygon, BaseObstacle only the centre point
      #critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.01 # v5: was BaseObstacle.scale
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.5 #0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.5 #0.1
      PathDist.scale: 40.0 #32.0
      GoalDist.scale: 30.0 #24.0
      RotateToGoal.scale: 32.0 # v2: was 40.0 - slightly less aggressive final rotation
      RotateToGoal.slowing_factor: 5.0 # v2: was 1.0 (Nav2 default) - slow down before rotating at goal
      RotateToGoal.lookahead_time: -1.0
      # If the final rotation still overshoots, try lowering max_vel_theta to ~0.6

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint # v5: was base_link
      use_sim_time: True
      rolling_window: true
      width: 16 #3
      height: 16 #3
      resolution: 0.05
      # v5: vendor footprint x10 (world and robot are 10x scale), relative to base_footprint (axle centre)
      footprint: "[ [-0.7, -1.9], [-0.7, 1.9], [3.5, 1.9], [3.5, -1.9] ]"
      # v5: obstacle_layer instead of voxel_layer. The lidar is at z ~ -0.28 in odom, below the voxel
      # grid (origin_z 0.0) -> "Sensor origin ... is out of map bounds" and no clearing.
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.5 #3.0
        inflation_radius: 3.0 #0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_corrected
          min_obstacle_height: -1.0 # v5: lidar points are at z ~ -0.28; default 0.0 drops them
          max_obstacle_height: 3.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 20.0 #3.0
          raytrace_min_range: 0.05 #0.0
          obstacle_max_range: 15.0 #2.5
          obstacle_min_range: 0.05 #0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint # v5: was base_link
      use_sim_time: True
      # v5: vendor footprint x10 (world and robot are 10x scale), relative to base_footprint (axle centre)
      footprint: "[ [-0.7, -1.9], [-0.7, 1.9], [3.5, 1.9], [3.5, -1.9] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_corrected
          min_obstacle_height: -1.0 # v5: lidar points are at z ~ -0.28; default 0.0 drops them
          max_obstacle_height: 3.0 #2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 25.0 #3.0
          raytrace_min_range: 0.05 #0.0
          obstacle_max_range: 20.0 #2.5
          obstacle_min_range: 0.05 #0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.5 #3.0
        inflation_radius: 3.0 #0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5      # unchanged - keeps fast planning
      use_astar: false    # unchanged - keeps fast planning
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint # v5: was base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8 #1.0
    min_rotational_vel: 0.5 # v6: was 0.2 (spin recovery)
    rotational_acc_lim: 0.8 #3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 1.0] #[0.26, 0.0, 1.0]
    min_velocity: [-2.0, 0.0, -1.0] #[-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 0.8] #[2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -0.8] #[-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
