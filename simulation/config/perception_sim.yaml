# Isaac Sim perception overrides. All three nodes read their own section.
# Use this file with:
#   ros2 launch ic382_perception perception.launch.py use_sim_time:=true \
#     config_file:=/workspace/robot-ros2/simulation/config/perception_sim.yaml
safety_monitor:
  ros__parameters:
    use_sim_time: true
    detector_mode: ultralytics
    model_profile: coco_bootstrap
    model_path: ""                 # e.g. /workspace/robot-ros2/models/yolo26n.pt
    device: ""                     # auto: GPU if the ROS container sees CUDA
    imgsz: 640
    detection_conf: 0.35
    iou: 0.45
    half: false
    max_det: 50
    warmup: true
    max_fps: 20.0
    image_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info
    depth_scale: 1.0               # Isaac Sim depth is commonly 32FC1 metres
    depth_is_aligned: true
    stop_distance_m: 0.8
    clear_distance_m: 1.2
    confirm_frames: 3
    clear_frames: 5
    sensor_timeout: 0.5
    fail_safe_on_stale: false      # simulation may run without a camera bridge
    unknown_distance_stop: false
    person_height_m: 1.7

object_classifier:
  ros__parameters:
    use_sim_time: true
    camera_info_topic: /camera/color/camera_info
    tag_conf_threshold: 0.5
    tagging_enabled: false
    roi: [0.0, 0.0, 1.0, 1.0]
    max_fps: 5.0
    base_frame: base_link
    camera_frame: camera_link       # Isaac scene publishes this frame
    use_tf: true
    tf_timeout: 0.1
    allow_camera_frame_fallback: false

fair_chance_manager:
  ros__parameters:
    use_sim_time: true
    desks: [T04]                   # the current simulation scene exposes T04
    auto_start: true
    round2_delay_seconds: 10.0     # shorter than the physical 60-120 s
    observation_window_seconds: 2.0
    min_frames: 2
    perception_required: false     # keep the navigation demo running without a camera
    tagging_enabled: false
    spec_log_path: /workspace/robot-ros2/results/perception/decision_log.json
    use_tf: true
    base_frame: base_link
    map_frame: map
